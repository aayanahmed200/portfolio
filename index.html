<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aayan Ahmed — UX & Web Design. Human-centered digital experiences with a clean, minimalist aesthetic." />
  <title>Aayan Ahmed | Portfolio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">
        <img src="/favicon.svg" alt="Aayan Ahmed" class="brand-icon" />
      </div>
      <div class="brand-text">
        <span class="brand-name">Aayan</span>
        <span class="brand-name second">Ahmed</span>
      </div>
      <button class="lang-toggle" aria-label="Language selector">
        <span class="flag">🇬🇧</span>
        <span class="caret">▾</span>
      </button>
    </div>

    <nav class="nav" aria-label="Main navigation">
      <a href="#projects" class="nav-link">Projects</a>
      <a href="#about" class="nav-link">About Me</a>
      <a href="#services" class="nav-link">Services</a>
      <a href="#faq" class="nav-link">FAQ</a>
      <a href="#contact" class="nav-link contact-link">Contact</a>
    </nav>
  </header>

  <main class="hero-wrap">
    <section class="hero reveal">
      <div class="hero-kicker">UX &amp; WEB DESIGN</div>

      <div class="hero-row">
        <div class="hero-text-block">
          <div class="hero-line">
            <span class="line-text">Hi,</span>
            <div class="portrait-card">
              <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80" alt="Portrait of Aayan Ahmed" />
            </div>
            <span class="line-text large">I'm Aayan!</span>
          </div>
        </div>

        <aside class="school-card" aria-label="Current school block">
          <div class="school-logo" aria-hidden="true"></div>
          <div class="school-content">
            <span class="card-label">Currently</span>
            <h2>Aitchison College</h2>
            <p>A-Level Student</p>
            <p>Physics, Computer Science,<br />Mathematics, History</p>
          </div>
        </aside>
      </div>

      <p class="intro">
        I craft clean, human-centered digital experiences that feel effortless and look beautiful.
      </p>

      <div class="scroll-indicator" aria-hidden="true">
        <span></span>
        <span></span>
      </div>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
